<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #scanner-container {
            position: relative;
            margin: 20px 0;
            width: 600px;
            height: 400px;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid #333;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            min-width: 300px;
            text-align: center;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .drawingBuffer {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Barcode & QR Scanner</h1>
    <div id="scanner-container">
        <video id="video" playsinline></video>
        <canvas id="overlay"></canvas>
        <canvas class="drawingBuffer"></canvas>
    </div>
    <div id="result">Scanning...</div>
    <button id="restart-btn" style="display: none;">Scan Again</button>

    <!-- Подключаем обе библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

     <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const resultDiv = document.getElementById('result');
        const restartBtn = document.getElementById('restart-btn');
        let stream = null;
        let scanning = true;
        let useQuagga = true;

        // Функция для отправки данных на сервер
        async function sendToServer(data, type) {
            try {
                const response = await fetch('/out', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        code: data,
                        code_type: type
                    })
                });

                if (!response.ok) {
                    throw new Error('Server error');
                }

                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Error sending to server:', error);
                throw error;
            }
        }

        // Функция запуска камеры
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;

                startQuagga();
                requestAnimationFrame(scanQR);
            } catch (err) {
                resultDiv.textContent = 'Error: ' + err.message;
                console.error(err);
            }
        }

        // Инициализация Quagga для штрих-кодов
        function startQuagga() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: video,
                    constraints: {
                        width: 600,
                        height: 400,
                        facingMode: "environment"
                    },
                },
                decoder: {
                    readers: [
                        "code_128_reader"
                    ]
                },
                multiple: false,
                locator: {
                halfSample: true,
                patchSize: "medium" // Увеличить точность поиска
                },
                locate: true,
                frequency: 10
            }, function(err) {
                if (err) {
                    console.error("Quagga initialization failed:", err);
                    useQuagga = false;
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(async function(result) {
                if (!scanning) return;

                const code = result.codeResult.code;
                const format = result.codeResult.format;


                resultDiv.innerHTML = `
                    <strong>Found barcode:</strong><br>
                    Type: ${format || 'unknown'}<br>
                    Data: ${code}
                `;

                stopScanning();
                restartBtn.style.display = 'block';
                drawQuaggaRect(result.box);

                // Отправка данных на сервер
                try {
                    await sendToServer(code, format);
                    resultDiv.innerHTML += '<br><span class="success">✓ Data sent to server</span>';
                } catch (error) {
                    resultDiv.innerHTML += `<br><span class="error">✗ Error: ${error.message}</span>`;
                }
            });
        }

        // Функция сканирования QR-кодов
        function scanQR() {
            if (!scanning || !useQuagga) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const ctx = overlay.getContext('2d');
                ctx.clearRect(0, 0, overlay.width, overlay.height);

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const tempCtx = canvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert',
                });

                if (code) {
                    drawRect(code.location);
                    resultDiv.innerHTML = `
                        <strong>Found QR code:</strong><br>
                        Type: ${code.format || 'unknown'}<br>
                        Data: ${code.data}
                    `;
                    stopScanning();
                    restartBtn.style.display = 'block';

                    // Отправка данных на сервер
                    sendToServer(code.data, code.format)
                        .then(() => {
                            resultDiv.innerHTML += '<br><span class="success">✓ Data sent to server</span>';
                        })
                        .catch(error => {
                            resultDiv.innerHTML += `<br><span class="error">✗ Error: ${error.message}</span>`;
                        });
                    return;
                }
            }

            if (scanning) {
                requestAnimationFrame(scanQR);
            }
        }

        // Рисуем прямоугольник вокруг найденного QR-кода
        function drawRect(location) {
            const ctx = overlay.getContext('2d');
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(location.topLeftCorner.x, location.topLeftCorner.y);
            ctx.lineTo(location.topRightCorner.x, location.topRightCorner.y);
            ctx.lineTo(location.bottomRightCorner.x, location.bottomRightCorner.y);
            ctx.lineTo(location.bottomLeftCorner.x, location.bottomLeftCorner.y);
            ctx.closePath();
            ctx.stroke();
        }

        // Рисуем прямоугольник для штрих-кода (Quagga)
        function drawQuaggaRect(box) {
            const ctx = overlay.getContext('2d');
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(box[0].x, box[0].y);
            for (let i = 1; i < box.length; i++) {
                ctx.lineTo(box[i].x, box[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // Остановка сканирования
        function stopScanning() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (useQuagga) {
                Quagga.stop();
            }
        }

        // Перезапуск сканирования
        restartBtn.addEventListener('click', () => {
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            resultDiv.textContent = 'Scanning...';
            restartBtn.style.display = 'none';
            scanning = true;
            startCamera();
        });

        // Запуск при загрузке страницы
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
