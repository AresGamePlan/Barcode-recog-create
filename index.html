<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Штрихкод PNG высокого качества</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    input, button {
      font-size: 16px;
      padding: 10px;
      margin: 10px;
    }
    canvas {
      margin-top: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Генератор Штрихкода (высокое качество PNG)</h1>

  <input type="text" id="barcode-input" placeholder="Введите данные (например, 123456789012)" />
  <br>
  <button onclick="generateBarcode()">Сгенерировать</button>
  <button onclick="downloadBarcode()">Скачать PNG</button>

  <br />
  <canvas id="barcode-canvas"></canvas>

  <script>
    function generateBarcode() {
      const input = document.getElementById("barcode-input").value.trim();
      if (input === "") {
        alert("Введите данные для генерации штрихкода.");
        return;
      }

      const scale = 4; // масштаб для высокого качества
      const canvas = document.getElementById("barcode-canvas");

      // Устанавливаем размер canvas вручную
      canvas.width = 600 * scale;
      canvas.height = 150 * scale;

      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale); // масштабируем всё содержимое

      JsBarcode(canvas, input, {
        format: "CODE128",
        lineColor: "#000",
        width: 2,
        height: 100,
        displayValue: true,
        fontSize: 20,
        margin: 10
      });
    }

    function downloadBarcode() {
      const canvas = document.getElementById("barcode-canvas");
      const link = document.createElement("a");
      link.download = "barcode-highres.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }
  </script>
</body>
</html>
